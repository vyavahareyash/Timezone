name: Timezone
options:
  bundleIdPrefix: com.vyavahareyash
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  TimezoneCore:
    type: framework
    platform: macOS
    sources: [Core]
  Timezone:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: TimezoneCore
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
  TimezoneCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CoreTests]
    dependencies:
      - target: TimezoneCore
  TimezoneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
        excludes: ["__Snapshots__/**"]
    dependencies:
      - target: Timezone
  TimezoneUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Timezone
schemes:
  Timezone:
    build:
      targets:
        Timezone: all
    test:
      targets: [TimezoneCoreTests, TimezoneTests, TimezoneUITests]

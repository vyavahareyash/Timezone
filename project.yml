name: Timezone
options:
  bundleIdPrefix: com.vyavahareyash
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  TimezoneCore:
    type: framework
    platform: macOS
    sources: [Core]
  Timezone:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: TimezoneCore
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: YES
  TimezoneCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CoreTests]
    dependencies:
      - target: TimezoneCore
schemes:
  Timezone:
    build:
      targets:
        Timezone: all
    test:
      targets: [TimezoneCoreTests]

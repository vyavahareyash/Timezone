<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The globe's surface is the panel's sky (App/TimezoneApp.swift skyLight): day, dusk at the edge, night. -->
  <defs>
    <linearGradient id="sky" x1="0" y1=".25" x2="1" y2=".75">
      <stop offset="0" stop-color="#C4E2F8"/><stop offset=".36" stop-color="#A8D2F2"/><stop offset=".5" stop-color="#F3C08B"/>
      <stop offset=".58" stop-color="#F2B072"/><stop offset=".68" stop-color="#7A5D92"/><stop offset=".84" stop-color="#28305A"/>
      <stop offset="1" stop-color="#1A2048"/>
    </linearGradient>
    <radialGradient id="light" cx=".32" cy=".28" r=".7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="512" cy="512" r="317" fill="url(#sky)"/>
  <circle cx="512" cy="512" r="317" fill="url(#light)"/>
</svg>
